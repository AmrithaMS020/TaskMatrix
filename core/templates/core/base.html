<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TaskMatrix{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #1e293b;
            --subcard-bg: #0f172a;
            --navbar-bg: #111827;
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-indigo: #6366f1;
            --status-success: #10b981;
            --status-warning: #f59e0b;
            --status-danger: #ef4444;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
        }

        .navbar {
            background-color: var(--navbar-bg) !important;
            border-bottom: 1px solid var(--border-color);
        }

        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-primary) !important;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            color: var(--text-primary);
       
       
       
                                                     }

        .card-hover {
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .bg-subcard {
            background-color: var(--subcard-bg) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 10px;
        }

        .text-secondary-light {
            color: var(--text-secondary) !important;
        }

        /* Custom dark badges */
        .badge-success-dark {
            background-color: rgba(16, 185, 129, 0.15) !important;
            color: #34d399 !important;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-warning-dark {
            background-color: rgba(245, 158, 11, 0.15) !important;
            color: #fbbf24 !important;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .badge-danger-dark {
            background-color: rgba(239, 68, 68, 0.15) !important;
            color: #f87171 !important;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .badge-info-dark {
            background-color: rgba(59, 130, 246, 0.15) !important;
            color: #60a5fa !important;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .badge-purple-dark {
            background-color: rgba(139, 92, 246, 0.15) !important;
            color: #a78bfa !important;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        /* Dark tables */
        .table {
            color: var(--text-primary) !important;
            --bs-table-bg: transparent;
            --bs-table-border-color: var(--border-color);
        }

        .table th {
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--subcard-bg);
        }

        .table td {
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        .table-hover tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.03) !important;
            color: var(--text-primary) !important;
        }

        .table-danger, .table-danger > td {
            background-color: rgba(239, 68, 68, 0.15) !important;
            color: #f87171 !important;
        }

        /* Form inputs in dark mode */
        .form-control, .form-select {
            background-color: var(--subcard-bg) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-primary) !important;
            border-radius: 8px;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--accent-blue) !important;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2) !important;
        }

        .form-label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Dark links & buttons */
        a {
            color: var(--accent-blue);
            transition: color 0.15s ease;
        }

        a:hover {
            color: #60a5fa;
        }

        .btn-primary {
            background-color: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        .btn-primary:hover {
            background-color: #2563eb;
            border-color: #2563eb;
        }

        .btn-outline-light {
            border-color: var(--border-color);
            color: var(--text-secondary);
        }

        .btn-outline-light:hover {
            background-color: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Highlight Panels */
        .highlight-panel-blue {
            background: rgba(59, 130, 246, 0.08);
            border-left: 4px solid var(--accent-blue);
            border-radius: 8px;
            padding: 1.25rem;
        }

        .highlight-panel-purple {
            background: rgba(139, 92, 246, 0.08);
            border-left: 4px solid var(--accent-purple);
            border-radius: 8px;
            padding: 1.25rem;
        }

        /* Progress bar dark style */
        .progress {
            background-color: var(--subcard-bg);
            border-radius: 999px;
            overflow: hidden;
        }

        /* List group dark */
        .list-group-item {
            background-color: transparent !important;
            border-color: var(--border-color) !important;
            color: var(--text-primary) !important;
        }

        .text-muted-dark {
            color: var(--text-secondary) !important;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    
    <nav class="navbar navbar-dark mb-4">
        <div class="container">
            <span class="navbar-brand fs-4">TaskMatrix</span>
            <div class="d-flex align-items-center gap-3">
                <span class="navbar-text text-secondary-light">{% block nav_role %}{% endblock %}</span>
                {% if request.session.user_type %}
                    <a href="{% url 'core:notification_list' %}" class="btn btn-outline-light btn-sm">
                        &#128276; Notifications
                    </a>
                    <a href="{% url 'core:logout' %}" class="btn btn-outline-light btn-sm">Log Out</a>
                {% endif %}
            </div> 
        </div>
    </nav>

    <div class="container pb-5">
        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
