{% extends "core/base.html" %}
{% block title %}Report Bug — {{ module.module_name }}{% endblock %}
{% block nav_role %}Tester view{% endblock %}

{% block content %}
<a href="{% url 'core:module_detail_test' module.module_id %}" class="text-decoration-none small">&larr; Back to module</a>

<div class="card mt-3">
    <div class="card-body">
        <h4 class="mb-3">Log a Bug — {{ module.module_name }}</h4>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Bug Title</label>
                <input type="text" name="bug_title" class="form-control" required maxlength="200">
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="4"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Severity</label>
                <select name="severity" class="form-select">
                    {% for value, label in severity_choices %}
                        <option value="{{ value }}" {% if value == 'Medium' %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-danger">Submit Bug Report</button>
        </form>
    </div>
</div>
{% endblock %}
