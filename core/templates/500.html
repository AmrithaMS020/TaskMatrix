<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something Went Wrong — TaskMatrix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .error-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f6f8fb;
            text-align: center;
            padding: 24px;
        }
        .error-card { max-width: 460px; }
        .error-badge {
            width: 56px; height: 56px;
            background-color: #fdeaea;
            color: #dc3545;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .error-code { font-size: 3.2rem; font-weight: 700; color: #0f1522; margin-bottom: 6px; }
        .error-title { font-size: 1.2rem; font-weight: 600; color: #374151; margin-bottom: 10px; }
        .error-sub { color: #6b7280; margin-bottom: 28px; }
        .btn-home {
            background-color: #3b6cf5; border: none; padding: 10px 24px; border-radius: 8px;
            font-weight: 600; color: #fff; text-decoration: none; display: inline-block;
        }
        .btn-home:hover { background-color: #2f5ad8; color: #fff; }
    </style>
</head>
<body>
<div class="error-wrap">
    <div class="error-card">
        <div class="error-badge">TM</div>
        <div class="error-code">500</div>
        <div class="error-title">Something went wrong on our end</div>
        <p class="error-sub">We're sorry — an unexpected error occurred. Please try again in a moment.</p>
        <a href="/login/" class="btn-home">Back to Login</a>
    </div>
</div>
</body>
</html>
